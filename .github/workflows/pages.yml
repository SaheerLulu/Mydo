name: Deploy to GitHub Pages

# Publishes the static site (root of the repo) to GitHub Pages.
# Requires: repo Settings → Pages → "Build and deployment" → Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/linkedin-posts-github-blogs-12AuF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages (with the GitHub Actions source) automatically.
          # If the token lacks permission, enable it once via Settings → Pages.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root (static HTML site).
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
