<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs></defs>
<rect x="0.5" y="0.5" width="1039" height="399" rx="18" fill="#ffffff" stroke="#e3e8f0"/>
<text x="40" y="50" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#1a1a1a" font-weight="800" text-anchor="start">Speed is the deal</text><text x="40" y="76" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#6b7280" font-weight="400" text-anchor="start">Replying first, every time — day or night.</text><line x1="180" y1="144" x2="200" y2="144" stroke="#374151" stroke-width="6" stroke-linecap="round"/><line x1="190" y1="140" x2="190" y2="156" stroke="#374151" stroke-width="6" stroke-linecap="round"/><circle cx="190" cy="250" r="84" fill="#ffffff" stroke="#0ea5a4" stroke-width="6"/><line x1="190" y1="176" x2="190" y2="166" stroke="#dbe4f3" stroke-width="2"/><line x1="227" y1="186" x2="232" y2="177" stroke="#dbe4f3" stroke-width="2"/><line x1="254" y1="213" x2="263" y2="208" stroke="#dbe4f3" stroke-width="2"/><line x1="264" y1="250" x2="274" y2="250" stroke="#dbe4f3" stroke-width="2"/><line x1="254" y1="287" x2="263" y2="292" stroke="#dbe4f3" stroke-width="2"/><line x1="227" y1="314" x2="232" y2="323" stroke="#dbe4f3" stroke-width="2"/><line x1="190" y1="324" x2="190" y2="334" stroke="#dbe4f3" stroke-width="2"/><line x1="153" y1="314" x2="148" y2="323" stroke="#dbe4f3" stroke-width="2"/><line x1="126" y1="287" x2="117" y2="292" stroke="#dbe4f3" stroke-width="2"/><line x1="116" y1="250" x2="106" y2="250" stroke="#dbe4f3" stroke-width="2"/><line x1="126" y1="213" x2="117" y2="208" stroke="#dbe4f3" stroke-width="2"/><line x1="153" y1="186" x2="148" y2="177" stroke="#dbe4f3" stroke-width="2"/><line x1="190" y1="250" x2="228" y2="201" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/><circle cx="190" cy="250" r="6" fill="#1a1a1a"/><text x="190" y="368" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0ea5a4" font-weight="800" text-anchor="middle">under 60 seconds</text><text x="360" y="150" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="800" text-anchor="start">Time to first response</text><rect x="360" y="170" width="90" height="30" rx="8" fill="#0ea5a4" stroke="#0ea5a4" stroke-width="1"/><text x="405" y="191" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Biloop</text><text x="462" y="191" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151" font-weight="700" text-anchor="start">&lt; 1 min</text><rect x="360" y="212" width="520" height="30" rx="8" fill="#fde2e4" stroke="#f6b9c2" stroke-width="1"/><text x="374" y="233" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#e11d48" font-weight="700" text-anchor="start">Manual follow-up</text><text x="720" y="233" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#e11d48" font-weight="700" text-anchor="start">hours → next day</text><rect x="360" y="266" width="540" height="90" rx="12" fill="#f8fafc" stroke="#e3e8f0" stroke-width="1"/><text x="378" y="292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="800" text-anchor="start">Why it matters</text><text x="378" y="316" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151" font-weight="500" text-anchor="start">Leads contacted in the first minute are far more likely to</text><text x="378" y="336" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151" font-weight="500" text-anchor="start">convert. Biloop makes “first” the default — without extra headcount.</text>
</svg>
