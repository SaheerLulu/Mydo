<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#19d3c5"/>
    </linearGradient>
    <linearGradient id="g-engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16224a"/>
      <stop offset="1" stop-color="#101935"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#4f7cff"/>
    </marker>
    <style>
      .title { fill:#e8edf7; font-size:28px; font-weight:800; }
      .sub { fill:#9aa6c4; font-size:15px; }
      .col { fill:#19d3c5; font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
      .node { fill:#16203f; stroke:#25325a; }
      .nlabel { fill:#d4dcf2; font-size:14px; font-weight:600; }
      .chip { fill:#101c3e; stroke:#2d3f73; }
      .clabel { fill:#ffffff; font-size:15px; font-weight:700; }
      .cdesc { fill:#9aa6c4; font-size:12.5px; }
      .bar { fill:#0c1430; stroke:#25325a; }
      .barlabel { fill:#9aa6c4; font-size:13px; font-weight:600; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="659" rx="18" fill="#0b1020" stroke="#25325a"/>

  <text x="40" y="50" class="title">Mydo by Biloop — Platform Architecture</text>
  <text x="40" y="78" class="sub">One foundation: connect every source, automate the work, predict what matters, and put decisions in front of people.</text>

  <!-- Column headers -->
  <text x="40"  y="128" class="col">Data Sources</text>
  <text x="300" y="128" class="col">Unify · Data Layer</text>
  <text x="560" y="128" class="col">Mydo AI Engine</text>
  <text x="900" y="128" class="col">Decide &amp; Act</text>

  <!-- Column A: Data Sources -->
  <g>
    <rect x="40"  y="150" width="200" height="50" rx="10" class="node"/><text x="60" y="180" class="nlabel">ERP / Accounting</text>
    <rect x="40"  y="214" width="200" height="50" rx="10" class="node"/><text x="60" y="244" class="nlabel">POS / Billing</text>
    <rect x="40"  y="278" width="200" height="50" rx="10" class="node"/><text x="60" y="308" class="nlabel">Spreadsheets / Email</text>
    <rect x="40"  y="342" width="200" height="50" rx="10" class="node"/><text x="60" y="372" class="nlabel">IoT / Sensors</text>
    <rect x="40"  y="406" width="200" height="50" rx="10" class="node"/><text x="60" y="436" class="nlabel">Legacy Systems / Docs</text>
  </g>

  <!-- arrow A -> B -->
  <line x1="248" y1="303" x2="292" y2="303" stroke="#4f7cff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column B: Unify -->
  <g>
    <rect x="300" y="150" width="200" height="306" rx="14" fill="#0e1730" stroke="#25325a"/>
    <rect x="318" y="172" width="164" height="56" rx="10" class="node"/><text x="338" y="206" class="nlabel">Connectors / APIs</text>
    <rect x="318" y="240" width="164" height="56" rx="10" class="node"/><text x="338" y="274" class="nlabel">Normalize Data</text>
    <rect x="318" y="308" width="164" height="56" rx="10" class="node"/><text x="338" y="342" class="nlabel">Unified Data Lake</text>
    <rect x="318" y="376" width="164" height="56" rx="10" class="node"/><text x="338" y="410" class="nlabel">Data Governance</text>
  </g>

  <!-- arrow B -> C -->
  <line x1="508" y1="303" x2="552" y2="303" stroke="#4f7cff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column C: Mydo AI Engine -->
  <g>
    <rect x="558" y="148" width="284" height="310" rx="16" fill="url(#g-engine)" stroke="url(#g-brand)" stroke-width="2"/>
    <rect x="578" y="172" width="244" height="58" rx="10" class="chip"/>
    <circle cx="600" cy="201" r="6" fill="#4f7cff"/><text x="616" y="197" class="clabel">Automate</text><text x="616" y="216" class="cdesc">AI agents · workflows · RPA</text>
    <rect x="578" y="240" width="244" height="58" rx="10" class="chip"/>
    <circle cx="600" cy="269" r="6" fill="#19d3c5"/><text x="616" y="265" class="clabel">Predict</text><text x="616" y="284" class="cdesc">Forecasts · anomaly detection</text>
    <rect x="578" y="308" width="244" height="58" rx="10" class="chip"/>
    <circle cx="600" cy="337" r="6" fill="#ffb020"/><text x="616" y="333" class="clabel">Document AI</text><text x="616" y="352" class="cdesc">Extract · classify · validate</text>
    <rect x="578" y="376" width="244" height="58" rx="10" class="chip"/>
    <circle cx="600" cy="405" r="6" fill="#a78bfa"/><text x="616" y="401" class="clabel">Decide</text><text x="616" y="420" class="cdesc">Conversational analytics</text>
  </g>

  <!-- arrow C -> D -->
  <line x1="850" y1="303" x2="894" y2="303" stroke="#4f7cff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Column D: Decide & Act -->
  <g>
    <rect x="900" y="150" width="180" height="50" rx="10" class="node"/><text x="920" y="180" class="nlabel">Live Dashboards</text>
    <rect x="900" y="214" width="180" height="50" rx="10" class="node"/><text x="920" y="244" class="nlabel">Conversational Q&amp;A</text>
    <rect x="900" y="278" width="180" height="50" rx="10" class="node"/><text x="920" y="308" class="nlabel">Alerts &amp; Actions</text>
    <rect x="900" y="342" width="180" height="50" rx="10" class="node"/><text x="920" y="372" class="nlabel">Mobile &amp; Portals</text>
    <rect x="900" y="406" width="180" height="50" rx="10" class="node"/><text x="920" y="436" class="nlabel">APIs &amp; Integrations</text>
  </g>

  <!-- Governance footer bar -->
  <rect x="40" y="500" width="1040" height="120" rx="14" class="bar"/>
  <text x="64" y="534" class="col">Built-in across every layer</text>
  <g class="barlabel">
    <rect x="64"  y="556" width="236" height="44" rx="10" class="node"/><text x="84"  y="584" class="barlabel">🔒 Security &amp; Role-based Access</text>
    <rect x="316" y="556" width="180" height="44" rx="10" class="node"/><text x="336" y="584" class="barlabel">🧾 Full Audit Trail</text>
    <rect x="512" y="556" width="252" height="44" rx="10" class="node"/><text x="532" y="584" class="barlabel">🙋 Human-in-the-loop Approvals</text>
    <rect x="780" y="556" width="300" height="44" rx="10" class="node"/><text x="800" y="584" class="barlabel">☁️ Cloud · On-prem · Hybrid Deploy</text>
  </g>
</svg>
