<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#19d3c5"/></linearGradient>
    <radialGradient id="hglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1b2c57"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1000" height="430" fill="#0b1020"/>
  <ellipse cx="500" cy="215" rx="430" ry="200" fill="url(#hglow)"/>

  <!-- connection lines from hub to satellites -->
  <g stroke="#2d3f73" stroke-width="2">
    <line x1="500" y1="215" x2="190" y2="100"/>
    <line x1="500" y1="215" x2="160" y2="300"/>
    <line x1="500" y1="215" x2="500" y2="60"/>
    <line x1="500" y1="215" x2="820" y2="110"/>
    <line x1="500" y1="215" x2="840" y2="320"/>
    <line x1="500" y1="215" x2="320" y2="370"/>
    <line x1="500" y1="215" x2="690" y2="375"/>
  </g>

  <!-- satellite nodes (industries / data sources) -->
  <g>
    <g><circle cx="190" cy="100" r="34" fill="#16203f" stroke="#25325a"/><text x="190" y="108" text-anchor="middle" font-size="26">💊</text></g>
    <g><circle cx="160" cy="300" r="34" fill="#16203f" stroke="#25325a"/><text x="160" y="308" text-anchor="middle" font-size="26">📊</text></g>
    <g><circle cx="500" cy="60"  r="34" fill="#16203f" stroke="#25325a"/><text x="500" y="68"  text-anchor="middle" font-size="26">🏢</text></g>
    <g><circle cx="820" cy="110" r="34" fill="#16203f" stroke="#25325a"/><text x="820" y="118" text-anchor="middle" font-size="26">🛠️</text></g>
    <g><circle cx="840" cy="320" r="34" fill="#16203f" stroke="#25325a"/><text x="840" y="328" text-anchor="middle" font-size="26">🛢️</text></g>
    <g><circle cx="320" cy="370" r="26" fill="#101c3e" stroke="#2d3f73"/><text x="320" y="377" text-anchor="middle" font-size="20">📈</text></g>
    <g><circle cx="690" cy="375" r="26" fill="#101c3e" stroke="#2d3f73"/><text x="690" y="382" text-anchor="middle" font-size="20">🤖</text></g>
  </g>

  <!-- central Mydo hub -->
  <circle cx="500" cy="215" r="88" fill="#101935" stroke="url(#hg)" stroke-width="3"/>
  <circle cx="500" cy="215" r="62" fill="none" stroke="#2d3f73" stroke-width="1.5" stroke-dasharray="4 6"/>
  <text x="500" y="208" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="800">Mydo</text>
  <text x="500" y="234" text-anchor="middle" fill="#9aa6c4" font-size="14" font-weight="600">AI Engine</text>
</svg>
